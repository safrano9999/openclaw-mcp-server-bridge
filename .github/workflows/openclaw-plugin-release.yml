# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: OpenClaw MCP bridge
on:
  push:
    branches: [main]
    tags: ['20*.*.*']
  pull_request:
  workflow_dispatch:
env:
  LITELLM_FREE_REF: ec90093347c29cacb82254773d48bd0b5a759c0e
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        openclaw: ['2026.9.4', '2026.10.6']
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LiteLLM-Free handler source
        uses: actions/checkout@v4
        with:
          repository: f24sales/litellm-free
          ref: ${{ env.LITELLM_FREE_REF }}
          path: .handler-source
      - name: Bundle the handler and refresh runtime
        run: python3 .handler-source/mcp/stage.py extensions
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Test shared authentication initialization
        run: python3 -m unittest discover -s test -p test_init.py -v
      - run: npm run build
      - name: Package installable ZIP
        run: bash .github/scripts/openclaw_plugin_zip.sh
      - name: Verify ZIP contains the pinned refresh helper
        run: unzip -p openclaw-mcp-server-bridge-latest.zip extensions/litellm-free/lib/ops/refresh_common.py | cmp - .handler-source/ops/refresh_common.py
      - name: Install exact OpenClaw host on the hosted runner
        env:
          OPENCLAW_VERSION: ${{ matrix.openclaw }}
        run: npm install --no-save --package-lock=false --no-audit --no-fund "openclaw@$OPENCLAW_VERSION"
      - name: Verify public SDK and load/install the ZIP
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw-bridge-state
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/openclaw-bridge-state/openclaw.json
        run: |
          npm run test:host
          node_modules/.bin/openclaw plugins install --force --accept-capabilities "$PWD/openclaw-mcp-server-bridge-latest.zip"
          node_modules/.bin/openclaw plugins inspect openclaw-mcp-server-bridge --json
          node scripts/gateway-smoke.js
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LiteLLM-Free handler source
        uses: actions/checkout@v4
        with:
          repository: f24sales/litellm-free
          ref: ${{ env.LITELLM_FREE_REF }}
          path: .handler-source
      - name: Bundle the handler and refresh runtime
        run: python3 .handler-source/mcp/stage.py extensions
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bash .github/scripts/openclaw_plugin_zip.sh
      - name: Verify ZIP contains the pinned refresh helper
        run: unzip -p openclaw-mcp-server-bridge-latest.zip extensions/litellm-free/lib/ops/refresh_common.py | cmp - .handler-source/ops/refresh_common.py
      - name: Publish verified archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" openclaw-mcp-server-bridge-latest.zip openclaw-mcp-server-bridge-latest.zip.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Generic MCP and notification bridge with configured defaults and bundled LiteLLM-Free handler. Public SDK and archive installation checked on OpenClaw 2026.9.4 and 2026.10.6. See README for delivery guarantees and scope.'
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest openclaw-mcp-server-bridge-latest.zip openclaw-mcp-server-bridge-latest.zip.sha256 --clobber
            gh release edit latest --notes "Current source tag: $GITHUB_REF_NAME"
          else
            gh release create latest openclaw-mcp-server-bridge-latest.zip openclaw-mcp-server-bridge-latest.zip.sha256 \
              --target "$GITHUB_SHA" --title latest --notes "Current source tag: $GITHUB_REF_NAME"
          fi
